<style>
  .meta-game {
    display: none;
  }

  #prompt-display {
    padding: 20px;
    margin: 4% 20% 4% 20%;
    color: var(--text-color-1);
    text-align: center;
    font-family: var(--font-2);
  }

  #submit {
    position: relative;
    bottom: 0;
    left: 0;
    width: 8.5in;
    padding-right: 0.1in;
    box-sizing: border-box;
    pointer-events: none;
    margin: 0.5in auto;

    button {
      pointer-events: all;
      background: var(--background-color);
      border: 1px solid var(--text-color-1);
      padding: 2em 20%;
      border-radius: 0.5em;
      color: var(--text-color-1);
      font-family: var(--font);
      font-size: 16px;
      cursor: pointer;
      margin-left: auto;
    }

    button:hover {
      opacity: 0.7;
    }
  }

  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: var(--modal-overlay-color);
    backdrop-filter: blur(5px);
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background-color: var(--background-color);
    border: 1px solid var(--text-color-1);
    border-radius: 0.5em;
    padding: 2em;
    max-width: 8.5in;
    max-height: 80vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2em;
  }

  #alternate-text {
    color: var(--text-color-1);
    font-family: var(--font);
    font-size: 16px;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 1em;
  }

  .modal-buttons button {
    background: var(--background-color);
    border: 1px solid var(--text-color-1);
    padding: 0.5em 1em;
    border-radius: 0.5em;
    color: var(--text-color-1);
    font-family: var(--font);
    font-size: 16px;
    cursor: pointer;
  }

  .modal-buttons button:hover {
    opacity: 0.7;
  }
</style>

<template id="modal-template">
  <div id="complete-modal" class="modal meta-game" style="display: none;">
    <div class="modal-content">
      <div id="alternate-text"></div>
      <div class="modal-buttons">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-continue">Continue</button>
      </div>
    </div>
  </div>
</template>
