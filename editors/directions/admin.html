<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Directions</title>
    <link rel="icon" href="/assets/icons/pentip.png">
    <link rel="stylesheet" href="directions-menu.css">
    <style>
        :root {
            --background: #f8f9fa;
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #6c757d;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --border: #dee2e6;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
        }

        .admin-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .back-btn {
            padding: 0.75rem 1.5rem;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: var(--accent-hover);
        }

        .admin-section {
            margin-bottom: 2.5rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .admin-section h3 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border);
        }

        .admin-section > div {
            margin-bottom: 0.75rem;
        }

        .admin-section strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .direction-card {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background-color: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .direction-card h4 {
            margin: 0 0 1rem 0;
            font-size: 1.25rem;
            color: var(--accent);
        }

        .level-detail {
            margin: 1rem 0;
            padding: 1rem;
            background-color: white;
            border-left: 3px solid var(--accent);
            border-radius: 4px;
        }

        .level-detail strong {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--accent);
            font-size: 1.1em;
        }

        .admin-document {
            margin-bottom: 1rem;
            background: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .admin-document details {
            cursor: pointer;
        }

        .admin-document summary {
            padding: 1rem 1.5rem;
            font-weight: 500;
            user-select: none;
            transition: background-color 0.2s;
            list-style: none;
            display: flex;
            align-items: center;
        }

        .admin-document summary::-webkit-details-marker {
            display: none;
        }

        .admin-document summary::before {
            content: '▶';
            display: inline-block;
            margin-right: 0.75rem;
            transition: transform 0.2s;
            color: var(--accent);
            font-size: 0.8em;
        }

        .admin-document details[open] summary::before {
            transform: rotate(90deg);
        }

        .admin-document summary:hover {
            background-color: #e9ecef;
        }

        .document-content {
            padding: 1.5rem;
            background: white;
            border-top: 1px solid var(--border);
        }

        .document-content > div {
            margin-bottom: 1rem;
        }

        .document-image {
            margin: 1.5rem 0;
            text-align: center;
        }

        .document-image img {
            max-width: 100%;
            max-height: 500px;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 12px var(--shadow);
        }

        pre {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            border: 1px solid var(--border);
            font-size: 0.9em;
            line-height: 1.5;
            margin: 0.5rem 0;
        }

        details summary {
            cursor: pointer;
            padding: 0.5rem;
            background: #f8f9fa;
            border-radius: 4px;
            margin: 0.5rem 0;
            font-weight: 500;
        }

        details summary:hover {
            background: #e9ecef;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        button:not(.danger-btn) {
            background-color: var(--accent);
            color: white;
        }

        button:not(.danger-btn):hover {
            background-color: var(--accent-hover);
        }

        .danger-zone {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe5e5 100%);
            border-color: var(--danger);
        }

        .danger-zone h3 {
            color: var(--danger);
            border-bottom-color: var(--danger);
        }

        .danger-btn {
            background-color: var(--danger);
            color: white;
        }

        .danger-btn:hover {
            background-color: var(--danger-hover);
        }

        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .metadata-item {
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid var(--accent);
        }

        .stat-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: var(--accent);
            color: white;
            border-radius: 20px;
            font-weight: 600;
            margin-right: 0.5rem;
        }
    </style>
    <script type="module" src="admin.js"></script>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Directions Admin</h1>
            <a href="directions-menu.html" class="back-btn">← Back to Main</a>
        </div>

        <div id="adminContent">
            <!-- Admin content will be loaded here -->
        </div>
    </div>
</body>
</html>
