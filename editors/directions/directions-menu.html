<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directions</title>
    <link rel="icon" href="/assets/icons/pentip.png">
    <link rel="stylesheet" href="directions-menu.css">
    <script type="module" src="directions-helpers.js"></script>
</head>
<body>
    <div class="header-bar">
        <h1 id="directions-header">Directions</h1>
        <a href="admin.html" class="admin-btn">Admin</a>
    </div>

    <div class="errors" id="errors"></div>

    <div class="options-bar">
        <button onclick="openOptionsMenu()" class="options-btn">⚙️ Options</button>
    </div>

    <div class="levels-container" id="levels-list">
        <!-- Levels will be loaded dynamically -->
    </div>
    
    <!-- Options Modal -->
    <div id="options-modal" class="options-modal" style="display: none;">
        <div class="options-content">
            <h2>Options</h2>
            
        <div class="options-section">
            <div id="dateCreated"></div>
            <div id="dateModified"></div>
            <div id="saveStatus" class="save-status"></div>
            <input type="file" id="fileInput" accept=".json" style="display: none;">
            <h3>Save Management</h3>

            <button onclick="loadSaveState()">Load</button>
            <button onclick="saveState()">Save</button>
        </div>

        <div class="options-section">
            <h3>New Game</h3>
            <button onclick="restartState()">New Game</button>
        </div>
            
            <button onclick="closeOptionsMenu()" class="close-options-btn">Close</button>
        </div>
    </div>

    <div class="document-detail empty" id="documentDetail">
        Select a document to view details
    </div>

</body>
</html>
