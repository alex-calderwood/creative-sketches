<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directions</title>
    <link rel="icon" href="/editors/assets/icons/pentip.png">
    <link rel="preload" href="/editors/assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-VariableFont_wght.ttf" as="font" type="font/ttf">
    <link rel="stylesheet" href="/editors/assets/css/index.css">
    <script type="module" src="directions-helpers.js"></script>
</head>
<body>
    <div class="main-content">

        <div class="header">
            <h1>Directions</h1>
            <div class="subtitle"></div>

        </div>

        <div class="errors" id="errors"></div>

        <div class="options-bar">
            <button onclick="window.location.href='admin.html'" class="options-btn">Admin</button>
            <button onclick="openOptionsMenu()" class="options-btn">Menu</button>
        </div>

        <div class="levels-container" id="levels-list">
            <!-- Levels will be loaded dynamically -->
        </div>
    </div>

        
        <!-- Options Modal -->
        <div id="options-modal" class="options-modal" style="display: none;">
            <div class="options-content">
                <h2>Directions</h2>


            <div class="options-section">
                <h3>Go to The Writer's Project</h3>

                <button class="options-link" onclick="window.location.href='/editors'">The Writer's Project</button>
                <p>Play the full suite of editors in sandbox mode.</p>
            </div>
                
            <div class="options-section">
                <input type="file" id="fileInput" accept=".json" style="display: none;">
                <h3>Save Management</h3>

                <button onclick="loadSaveState()">Load</button>
                <button onclick="saveState()">Save</button>

                <div id="dateCreated"></div>
                <div id="dateModified"></div>
                <div id="saveStatus" class="save-status"></div>
            </div>

            <div class="options-section">
                <h3>New Game</h3>
                <button onclick="restartState()">New Game</button>
            </div>
                
                <button onclick="closeOptionsMenu()" class="close-options-btn">Close</button>
            </div>
        </div>

        <div class="document-detail empty" id="documentDetail">
        </div>

</body>
</html>
