<style>
  /* .meta-game {
    display: none;
  } */

#prompt-container {
  flex-drift: row;
  align-items: center;
  gap: 15px;
  padding: 10px 20px;
  background-color: transparent;
  display: none;
  flex-drift: row;
}

#prompt-display {
  padding: 10px;
  margin: 0;
  color: var(--text-color-1);
  text-align: left;
  font-family: var(--font-2);
  flex: 1;
}

#submit-button {
  pointer-events: all;
  background: var(--background-color);
  border: 1px solid var(--text-color-1);
  padding: 8px 16px;
  border-radius: 0.5em;
  color: var(--text-color-1);
  font-family: var(--font);
  font-size: 12px;
  cursor: pointer;
  margin: 0;
}

#submit-button:hover {
  opacity: 0.7;
}

  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: var(--modal-overlay-color);
    backdrop-filter: blur(5px);
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background-color: var(--background-color);
    border: 1px solid var(--text-color-1);
    border-radius: 0.5em;
    padding: 2em;
    max-width: 8.5in;
    max-height: 80vh;
    overflow-y: auto;
    display: flex;
    flex-drift: column;
    gap: 2em;
  }

  #alternate-text {
    color: var(--text-color-1);
    font-family: var(--font);
    font-size: 16px;
    white-space: pre-wrap;
    line-height: 1.5;
  }

  .modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 1em;
  }

  .modal-buttons button {
    background: var(--background-color);
    border: 1px solid var(--text-color-1);
    padding: 0.5em 1em;
    border-radius: 0.5em;
    color: var(--text-color-1);
    font-family: var(--font);
    font-size: 16px;
    cursor: pointer;
  }

  .modal-buttons button:hover {
    opacity: 0.7;
  }
</style>

<template id="modal-template">
  <div id="complete-modal" class="modal meta-game" style="display: none;">
    <div class="modal-content">
      <div id="alternate-text"></div>
      <div class="modal-buttons">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-continue">Continue</button>
      </div>
    </div>
  </div>
</template>
