<!-- Controls Section HTML/CSS -->
<style>

  @layer defaults {
    :root {
      --ui-font-size: 1.1em;
      --ui-font-size-large: 1.4em;
      --small-radius: 4px;
    }
  }

  #game-banner {
    width: 100%;
    box-sizing: border-box; /* TEST: prevent padding from affecting the width */
    display: flex;
    flex-direction: row;
    align-items: center;
    border-bottom: 1.5px solid var(--text-color);
    padding: 0.5vh 1vw;
    font-size: var(--ui-font-size);
  }

  #banner-content {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    width: 100%;
  }

  #mobile-menu-btn,
  #mobile-menu-close {
    display: none;
  }

  @media (max-width: 600px) {
    #mobile-menu-btn {
      display: block;
    }

    #banner-content {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--background-color);
      color: var(--text-color);
      z-index: 10000;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      padding: 20px;
      gap: 16px;
      box-sizing: border-box;
    }

    #banner-content.open {
      display: flex;
    }

    #mobile-menu-close {
      display: block;
      align-self: flex-end;
    }

    .controls-wrapper {
      flex-direction: column;
      align-items: flex-start;
    }

    .controls-buttons {
      flex-wrap: wrap;
    }
  }

  .back-link {
    color: var(--primary-color);
    text-decoration: none;
    cursor: pointer;
    font-weight: normal;
    font-family: var(--font);
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }

  .back-link:hover {
    border-bottom-color: var(--primary-color);
  }

  .nav-title {
    font-size: var(--ui-font-size);
  }

  .subtitle {
    font-style: italic;
  }

  .controls-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .control-btn {
    font-family: var(--font);
    background-color: transparent;
    border: 1px solid var(--primary-color);
    color: var(--button-color);
    font-size: var(--ui-font-size);
    padding: 2px 4px;
    cursor: pointer;
    outline: none;
    transition: background-color 0.2s, color 0.2s;
    border-radius: var(--small-radius);
  }

  .control-btn:hover {
    background-color: var(--text-color);
    color: var(--background-color)
    /* color: var(--button-color); */
  }

  .control-btn:active {
    background-color: var(--primary-color);
    color: var(--button-color);
    transform: scale(0.98);
  }

  #instructions-btn {
    display: none;
  }

  .document-selector-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    background-color: inherit;
  }

  .document-selector-content {
    background-color: var(--background-color);
    color: var(--text-color);
    padding: 20px;
    border-radius: 4px;
    border: 1px solid var(--primary-color);
    width: 50%;
    max-height: 70vh;
    overflow-y: auto;
  }

  .document-list-item {
    padding: 10px;
    margin: 5px 0;
    border: 1px solid var(--primary-color);
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .document-list-item:hover {
    background-color: var(--primary-color);
    color: var(--button-color, white);
  }

  .document-list-item .doc-id {
    font-weight: bold;
    font-size: var(--ui-font-size);
  }

  .document-list-item .doc-created {
    font-size: var(--ui-font-size);
    opacity: 0.7;
    margin-top: 4px;
  }

  .cancel-btn {
    margin-top: 15px;
    width: 100%;
  }

  .setting-item {
    margin-bottom: 15px;
    position: relative;
  }

  #settings-modal .modal-content {
    display: grid;
    grid-template-columns: auto auto;
    align-items: center;
    gap: 0.4em 1em;
    padding: 0 1em;
  }

  #settings-modal .modal-content h1 {
    grid-column: 1 / -1;
    font-family: var(--font);
    font-size: var(--ui-font-size-large);
    margin: 0;
  }

  #settings-modal .setting-item {
    display: contents;
    margin: 0;
  }

  #settings-modal .setting-label {
    font-size: var(--ui-font-size);
    font-weight: normal;
  }

  #settings-modal .setting-description {
    grid-column: 1 / -1;
    font-size: 0.85em;
    opacity: 0.6;
    margin-top: -0.2em;
    margin-bottom: 0.3em;
  }

  .setting-tooltip {
    position: fixed;
    background-color: var(--background-color);
    color: var(--text-color);
    padding: 5px 10px;
    font-size: var(--ui-font-size);
    white-space: normal;
    max-width: 300px;
    z-index: 1001;
    pointer-events: none;
    display: none;
    border: 1px solid var(--primary-color);
    border-radius: var(--small-radius);
  }

  .setting-description {
    font-size: var(--ui-font-size);
    opacity: 0.7;
    margin-top: 4px;
  }

  .setting-label {
    font-size: var(--ui-font-size-large, --ui-font-size);
    cursor: help;
  }

  .setting-toggle {
    cursor: pointer;
    font-size: var(--ui-font-size);
    padding: 1px 6px;
    border: 1px solid var(--text-color);
    color: var(--text-color);
    opacity: 0.5;
    border-radius: var(--small-radius);
  }

  .setting-toggle.on {
    opacity: 1;
  }

  .setting-input {
    /* width: 100%; */
    padding: 4px;
    border-radius: var(--small-radius);
    /* make the border color match */
    border-color: var(--primary-color);
    border-width: 1px;
  }

  .setting-input[type="number"] {
    max-width: 3em;
    text-align: center;
  }

  .setting-input[type="color"] {
    padding: 0px !important;
    height: 1.5em !important;
    width: 1em;
  }

  .setting-input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0em;
    width: 1em;
  }

  .setting-input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 0.125em;
  }

  .setting-input:focus {
    background-color: var(--highlight);
    color: var(--button-color);
  }

  .settings-title {
    margin-bottom: 15px;
    font-weight: bold;
  }

  .last-saved-info {
    opacity: 0.6;
    font-size: var(--ui-font-size);
    display: flex;
    flex-direction: row;
    gap: 4px;
    flex-wrap: nowrap; /* Prevent wrapping to a new line */
    overflow-x: auto; /* Enable horizontal scrolling if needed */
    overflow-y: hidden;
    white-space: nowrap;

  }

  .document-id {
    display: none;
  }

  .doc-info {
    font-size: var(--ui-font-size);
    opacity: 0.7;
  }

  .controls-buttons {
    /* display: none; */
    display:flex;
    gap: 8px;
  }

  .save-related {
    display: none;
  }

  .button-pair {
    display: flex;
    gap: 0;
    border: 1px solid var(--primary-color);
  }

  .button-pair .control-btn {
    border: none;
    border-right: 1px solid var(--primary-color);
  }

  .button-pair .control-btn:last-child {
    border-right: none;
  }

  .controls-wrapper:hover .document-id,
  .controls-wrapper:hover .controls-buttons {
    display: flex;
  }

  #settings-bar {
    width: 100%;
    display: none;
    flex-direction: row;
    flex-wrap: nowrap; /* Prevent wrapping to a new line */
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 4px 8px;
    border-bottom: 1px solid var(--text-color);
    font-size: var(--ui-font-size);
    box-sizing: border-box;
    overflow-x: auto; /* Enable horizontal scrolling if needed */
    overflow-y: hidden;
    white-space: nowrap;
    color: var(--text-color);
  }

  #settings-bar .setting-item {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 0;
  }

  #settings-bar .setting-label {
    font-size: var(--ui-font-size);
  }

  #settings-bar .setting-input {
    field-sizing: content;
    padding: 2px 4px;
    font-size: var(--ui-font-size);
  }

</style>

<div


<div id="game-banner">
  <button id="mobile-menu-btn" class="control-btn">☰</button>
  <div id="banner-content">
    <button id="mobile-menu-close" class="control-btn">✕</button>
    <div class="nav-title text">
      <a href="/editors/" id="back-link" class="back-link">The Writer's Project</a>
      <span class="subtitle"></span>
    </div>
    <div class="controls-wrapper">
    <div class="last-saved-info">
      <div id="last-saved" class="doc-info last-saved"></div>
      <div id="document-id" class="doc-info document-id"></div>
    </div>
    <div class="controls-buttons">
      <button id="instructions-btn" class="control-btn">Instructions</button>
      <button id="new-game-btn" class="control-btn">New Document</button>
      <button id="settings-btn" class="control-btn">Settings</button>

      <div class="button-pair">
        <button id="load-btn" class="control-btn save-related">Load</button>
        <button id="upload-btn" class="control-btn save-related">Upload</button>
      </div>
      <div class="button-pair">
        <button id="save-btn" class="control-btn save-related">Save</button>
        <button id="download-btn" class="control-btn save-related">Download</button>
      </div>
    </div>
    <input type="file" id="file-input" accept=".json" style="display: none;">
    </div>
  </div>
</div>
