<!-- Controls Section HTML/CSS -->
<style>

  #game-banner {
    width: 100%;
    height: 4vh;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    border-bottom: 1.5px solid var(--text-color);
  }

  .subtitle {
    font-style: italic;
  }

  .controls-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .control-btn {
    font-family: var(--font);
    background-color: transparent;
    border: 1px solid var(--primary-color);
    color: var(--button-color);
    font-size: 10px;
    padding: 2px 4px;
    cursor: pointer;
    outline: none;
    transition: background-color 0.2s, color 0.2s;
  }

  .control-btn:hover {
    background-color: var(--text-color);
    color: var(--background-color)
    /* color: var(--button-color); */
  }

  .control-btn:active {
    background-color: var(--primary-color);
    color: var(--button-color);
    transform: scale(0.98);
  }

  #instructions-btn {
    display: none;
  }

  .document-selector-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    background-color: inherit;
  }

  .document-selector-content {
    background-color: var(--background-color);
    color: var(--text-color);
    padding: 20px;
    border-radius: 4px;
    border: 1px solid var(--primary-color);
    width: 50%;
    max-height: 70vh;
    overflow-y: auto;
  }

  .document-list-item {
    padding: 10px;
    margin: 5px 0;
    border: 1px solid var(--primary-color);
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .document-list-item:hover {
    background-color: var(--primary-color);
    color: var(--button-color, white);
  }

  .document-list-item .doc-id {
    font-weight: bold;
    font-size: 0.9em;
  }

  .document-list-item .doc-created {
    font-size: 0.8em;
    opacity: 0.7;
    margin-top: 4px;
  }

  .cancel-btn {
    margin-top: 15px;
    width: 100%;
  }


  .setting-item {
    margin-bottom: 15px;
  }

  .setting-item {
    position: relative;
  }

  .setting-item[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    left: 0;
    top: 100%;
    background-color: var(--background-color);
    color: var(--text-color);
    padding: 5px 10px;
    font-size: 0.8em;
    white-space: normal;
    max-width: 300px;
    z-index: 1001;
    margin-top: 5px;
  }

  .setting-label {
    font-weight: bold;
    cursor: help;
  }

  .setting-input {
    width: 100%;
    padding: 4px;
  }

  .setting-input:focus {
    background-color: var(--highlight);
    color: var(--button-color);
  }

  .settings-title {
    margin-bottom: 15px;
    font-weight: bold;
  }

  .last-saved-info {
    opacity: 0.6;
    font-size: 0.9em;
    display: flex;
    flex-direction: row;
    gap: 4px;
  }

  .document-id {
    display: none;
  }

  .doc-info {
    font-size: 0.85em;
    opacity: 0.7;
  }

  .controls-buttons {
    /* display: none; */
    display:flex;
    gap: 8px;
  }

  .button-pair {
    display: flex;
    gap: 0;
    border: 1px solid var(--primary-color);
  }

  .button-pair .control-btn {
    border: none;
    border-right: 1px solid var(--primary-color);
  }

  .button-pair .control-btn:last-child {
    border-right: none;
  }

  .controls-wrapper:hover .document-id,
  .controls-wrapper:hover .controls-buttons {
    display: flex;
  }

</style>

<div


<div id="game-banner">
  <div class="text">
    <a href="/editors/" id="back-link" class="back-link">The Writer's Project</a>
    <span class="subtitle"></span>
  </div>
  <div class="controls-wrapper">
    <div class="last-saved-info">
      <div id="last-saved" class="doc-info last-saved"></div>
      <div id="document-id" class="doc-info document-id"></div>
    </div>
    <div class="controls-buttons">
      <button id="instructions-btn" class="control-btn">Instructions</button>
      <button id="new-game-btn" class="control-btn">New Document</button>
      <button id="settings-btn" class="control-btn">Settings</button>

      <div class="button-pair">
        <button id="load-btn" class="control-btn">Load</button>
        <button id="upload-btn" class="control-btn">Upload</button>
      </div>
      <div class="button-pair">
        <button id="save-btn" class="control-btn">Save</button>
        <button id="download-btn" class="control-btn">Download</button>
      </div>
    </div>
    <input type="file" id="file-input" accept=".json" style="display: none;">
  </div>
</div>
