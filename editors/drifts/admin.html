<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Drifts</title>
    <link rel="icon" href="/editors/assets/icons/pentip.png">
    <link rel="preload" href="/editors/assets/fonts/Plus_Jakarta_Sans/PlusJakartaSans-VariableFont_wght.ttf" as="font" type="font/ttf">
    <link rel="stylesheet" href="/editors/assets/css/index.css">
    <style>
        :root {
            --background: #ffffff;
            --card-bg: #ffffff;
            --text-primary: #18191a;
            --text-secondary: #656565;
            --accent: #656565;
            --accent-hover: #18191a;
            --danger: #cc0000;
            --danger-hover: #990000;
            --border: rgba(101, 101, 101, 0.35);
            --surface: #fafafa;
            --radius: 4px;
        }

        /* Reset the full-height flex layout index.css applies to <body>,
           which the admin page (normal scrolling document) isn't built for. */
        body {
            font-family: var(--font-2, 'EB Garamond', serif);
            background: var(--background);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            display: block;
            height: auto;
            min-height: 100vh;
            overflow: auto;
        }

        .admin-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2.5rem;
            box-sizing: border-box;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 3rem;
            padding-bottom: 1rem;
            border-bottom: 0.5px solid var(--text-secondary);
        }

        .admin-header h1 {
            margin: 0;
            font-family: var(--header-font, sans-serif);
            font-size: var(--header-font-size, 2rem);
            font-weight: 300;
            letter-spacing: 0.01em;
            color: var(--text-secondary);
        }

        .back-btn {
            padding: 0.3rem 0.7rem;
            background-color: #fff;
            color: var(--text-secondary);
            border: 1px solid #ddd;
            border-radius: 3px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-family: var(--header-font, sans-serif);
            font-weight: 400;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: #999;
            background-color: #f0f0f0;
        }

        .admin-section {
            margin-bottom: 2rem;
            background: var(--card-bg);
            border: 0.5px solid var(--text-secondary);
            padding: 1.75rem 2rem;
            border-radius: var(--radius);
        }

        .admin-section h3 {
            margin-top: 0;
            margin-bottom: 1.25rem;
            font-family: var(--header-font, sans-serif);
            font-size: var(--sub-header-font-size, 1.5rem);
            font-weight: 300;
            color: var(--text-secondary);
            padding-bottom: 0.6rem;
            border-bottom: 0.5px solid var(--border);
        }

        .admin-section > div {
            margin-bottom: 0.6rem;
        }

        .admin-section strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        .drift-card {
            margin-top: 1.25rem;
            padding: 1.25rem 1.5rem;
            background-color: var(--surface);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
        }

        .drift-card h4 {
            margin: 0 0 0.9rem 0;
            font-family: var(--header-font, sans-serif);
            font-weight: 400;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .level-detail {
            margin: 0.9rem 0;
            padding: 0.9rem 1rem;
            background-color: #fff;
            border-left: 2px solid var(--text-secondary);
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        .level-detail strong {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-secondary);
            font-family: var(--header-font, sans-serif);
            font-weight: 400;
            font-size: 1.05em;
        }

        .admin-document {
            margin-bottom: 0.75rem;
            background: #fff;
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .admin-document details {
            cursor: pointer;
        }

        .admin-document summary {
            padding: 0.85rem 1.25rem;
            font-weight: 400;
            user-select: none;
            transition: background-color 0.2s;
            list-style: none;
            display: flex;
            align-items: center;
        }

        .admin-document summary::-webkit-details-marker {
            display: none;
        }

        .admin-document summary::before {
            content: '›';
            display: inline-block;
            margin-right: 0.75rem;
            transition: transform 0.2s;
            color: var(--text-secondary);
            font-size: 1.2em;
            line-height: 1;
        }

        .admin-document details[open] summary::before {
            transform: rotate(90deg);
        }

        .admin-document summary:hover {
            background-color: var(--surface);
        }

        .document-content {
            padding: 1.25rem 1.5rem;
            background: #fff;
            border-top: 0.5px solid var(--border);
        }

        .document-content > div {
            margin-bottom: 0.9rem;
        }

        .document-image {
            margin: 1.25rem 0;
            text-align: center;
        }

        .document-image img {
            max-width: 100%;
            max-height: 500px;
            border: 0.5px solid var(--text-secondary);
            border-radius: var(--radius);
        }

        pre {
            background-color: var(--surface);
            padding: 1rem;
            border-radius: var(--radius);
            overflow-x: auto;
            border: 0.5px solid var(--border);
            font-size: 0.85em;
            line-height: 1.5;
            margin: 0.5rem 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        details summary {
            cursor: pointer;
            padding: 0.4rem 0.6rem;
            background: var(--surface);
            border-radius: var(--radius);
            margin: 0.5rem 0;
            font-family: var(--header-font, sans-serif);
            font-weight: 400;
            color: var(--text-secondary);
        }

        details summary:hover {
            background: #f0f0f0;
        }

        button {
            padding: 0.4rem 0.9rem;
            border: 1px solid #ddd;
            border-radius: 3px;
            cursor: pointer;
            font-family: var(--header-font, sans-serif);
            font-weight: 400;
            font-size: 1rem;
            transition: all 0.2s ease;
            margin-top: 1rem;
        }

        button:not(.danger-btn) {
            background-color: #fff;
            color: var(--text-secondary);
        }

        button:not(.danger-btn):hover {
            border-color: #999;
            background-color: #f0f0f0;
        }

        .danger-zone {
            background: #fff;
            border-color: var(--border);
        }

        .danger-zone h3 {
            color: var(--text-secondary);
            border-bottom-color: var(--border);
        }

        .danger-btn {
            background-color: #ffdddd;
            border: 1px solid #ffaaaa;
            color: var(--danger);
        }

        .danger-btn:hover {
            background-color: #ffcccc;
            border-color: #ff8888;
        }

        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .metadata-item {
            padding: 0.8rem 1rem;
            background: var(--surface);
            border-radius: var(--radius);
            border-left: 2px solid var(--text-secondary);
        }

        .metadata-item strong {
            font-family: var(--header-font, sans-serif);
            font-weight: 400;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }

        .stat-badge {
            display: inline-block;
            padding: 0.15rem 0.7rem;
            background: var(--text-secondary);
            color: #fff;
            border-radius: 20px;
            font-family: var(--header-font, sans-serif);
            font-weight: 400;
            font-size: 0.9rem;
            margin-right: 0.5rem;
        }
    </style>
    <script type="module" src="admin.js"></script>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Drifts Admin</h1>
            <a href="drifts-menu.html" class="back-btn">← Back to Main</a>
        </div>

        <div id="adminContent">
            <!-- Admin content will be loaded here -->
        </div>
    </div>
</body>
</html>
