<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$PROJECT_NAME</title>
  <link rel="stylesheet" href="base-style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-banner">
    <div class="text">
      <a href="/editors/" class="back-link">The Writer's Project</a>
      <span class="subtitle" data-tooltip="$DESCRIPTION">$PROJECT_NAME</span>
    </div>

    <div id="controls" class="controls"></div>
  </div>

  <div id="constraint-display" class="constraint-display">
    <div id="constraint-terms" class="constraint-terms"></div>
    <div id="constraint-title" class="constraint-title"></div>
  </div>

  <div id="prompt-container" class="meta-game prompt-container">
    <div id="prompt-display" class="meta-game"></div>
    <div id="submit" class="meta-game"></div>
  </div>

  <div id="editor-container" class="editor-container">
    <div id="editor" class="editor" spellcheck="false" contenteditable="true"></div>
    <div id="overlay" class="overlay"></div>
  </div>


  <!-- Load compromise lib (not the best way of doing it) -->
  <script src="/editors/assets/lib/compromise.js"></script>

  <script type="module">
    import { Game } from './src/game.js';
    import { MetaGame } from '/editors/drifts/MetaGame.js';

    const PROJECT_ID = '$PROJECT_ID';
    const PROJECT_NAME = '$PROJECT_NAME';
    const DESCRIPTION = '$DESCRIPTION';
    if (PROJECT_ID.startsWith('$')) {
      console.error('PROJECT_ID is not set');
    }

    // let initialState = null;
    // if (params.documentId) {
    //   let doc = this.save.getDocument(this.documentId);
    //   let content = doc?.getField('content');
    //   initialState = content ? JSON.parse(content) : null;
    // }
    
    document.addEventListener('DOMContentLoaded', async () => {
      const game = new Game();
      const metaGame = new MetaGame(PROJECT_ID, PROJECT_NAME, { description: DESCRIPTION });
      await metaGame.initialize(game);
    });
  </script>
</body>
</html>
