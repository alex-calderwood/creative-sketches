<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropper</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <div id="game-banner">
    <div class="text">
      <a href="/editors/" class="back-link">The Writer's Project</a>
    </div>
    
    <div class="controls">
      <button id="paste-text-btn" class="control-btn">Corpus</button>
      <div class="option">
        <label for="delete-ratio">Delete Ratio:</label>
        <select id="delete-ratio">
          <option value="0.0">0%</option>
          <option value="0.1">10%</option>
          <option value="0.2">20%</option>
          <option value="0.3">30%</option>
          <option value="0.4" selected>40%</option>
          <option value="0.5">50%</option>
          <option value="0.6">60%</option>
          <option value="0.7">70%</option>
          <option value="0.8">80%</option>
          <option value="0.9">90%</option>
        </select>
      </div>
    </div>

  </div>



  <script src="events.js"></script>
  <script src="sound.js"></script>
  <script src="lib/compromise.js"></script>
  <script src="corpus.js"></script>
  <script src="dropper.js"></script>
  
  <!-- Corpus Modal -->
  <div id="corpus-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Corpus Editor</h3>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div id="corpora-container">
          <!-- Dynamic corpora will be added here -->
        </div>
        <button id="add-corpus-btn" class="control-btn">Add Corpus</button>
      </div>
      <div class="modal-footer">
        <button id="save-corpus" class="control-btn">Save</button>
        <button id="cancel-corpus" class="control-btn">Cancel</button>
      </div>
    </div>
  </div>
</body>
</html>
