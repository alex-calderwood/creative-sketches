<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$PROJECT_NAME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Trocchi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="base-style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-banner">
    <div class="text">
      <a href="/editors/" class="back-link">The Writer's Project</a>
      <span class="subtitle" data-tooltip="$DESCRIPTION">$PROJECT_NAME</span>
    </div>

    <div id="controls" class="controls"></div>
  </div>

  <div id="shader-area">
    <div id="prompt-container" class="meta-game prompt-container">
      <div id="prompt-display" class="meta-game"></div>
      <div id="submit" class="meta-game"></div>
    </div>

    <div id="editor-container" class="editor-container">
      <div id="editor" class="editor" spellcheck="false" contenteditable="true"></div>
    </div>
  </div>

  <script type="module">
    import { Game } from './src/game.js';
    import { MetaGame } from '/editors/drifts/MetaGame.js';

    const PROJECT_ID = '$PROJECT_ID';
    const PROJECT_NAME = '$PROJECT_NAME';
    const DESCRIPTION = '$DESCRIPTION';
    if (PROJECT_ID.startsWith('$')) {
      console.error('PROJECT_ID is not set');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const game = new Game();
      const metaGame = new MetaGame(PROJECT_ID, PROJECT_NAME, { description: DESCRIPTION });
      await metaGame.initialize(game);
    });
  </script>
</body>
</html>
