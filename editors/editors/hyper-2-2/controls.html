<!-- Controls Section HTML/CSS -->
<style>
  .controls-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .control-btn {
    font-family: var(--font);
    background-color: transparent;
    border: 1px solid var(--primary-color);
    color: var(--button-color);
    font-size: 10px;
    padding: 2px 4px;
    cursor: pointer;
    outline: none;
    transition: background-color 0.2s, color 0.2s;
  }

  .control-btn:hover {
    background-color: var(--primary-color);
    color: var(--button-color);
  }

  .control-btn:active {
    background-color: var(--primary-color);
    color: var(--button-color);
    transform: scale(0.98);
  }

  .document-selector-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .document-selector-content {
    background-color: var(--background-color);
    color: var(--text-color);
    padding: 20px;
    border-radius: 4px;
    border: 1px solid var(--primary-color);
    max-width: 40vw;
    max-height: 70vh;
    overflow-y: auto;
  }

  .cancel-btn {
    margin-top: 15px;
    width: 100%;
  }

  .setting-item {
    margin-bottom: 15px;
  }

  .setting-item {
    position: relative;
  }

  .setting-item[data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    left: 0;
    top: 100%;
    background-color: var(--background-color);
    color: var(--text-color);
    padding: 5px 10px;
    font-size: 0.8em;
    white-space: normal;
    max-width: 300px;
    z-index: 1001;
    margin-top: 5px;
  }

  .setting-label {
    font-weight: bold;
    cursor: help;
  }

  .settings-title {
    margin-bottom: 15px;
    font-weight: bold;
  }

  .last-saved-info {
    opacity: 0.6;
    font-size: 0.9em;
    display: flex;
    flex-direction: row;
    gap: 4px;
  }


  .document-id {
    display: none;
  }

  .doc-info {
    font-size: 0.85em;
    opacity: 0.7;
  }

  .controls-buttons {
    display: none;
    gap: 8px;
  }

  .controls-wrapper:hover .document-id,
  .controls-wrapper:hover .controls-buttons {
    display: flex;
  }

</style>

<div id="controls-template">
  <div class="controls-wrapper">
    <div class="last-saved-info">
      <div id="last-saved" class="doc-info last-saved"></div>
      <div id="document-id" class="doc-info document-id"></div>
    </div>
    <div class="controls-buttons">
      <button id="save-btn" class="control-btn">Save</button>
      <button id="download-save-btn" class="control-btn">Download Save</button>
      <button id="load-btn" class="control-btn">Load</button>
      <button id="new-game-btn" class="control-btn">New</button>
      <button id="settings-btn" class="control-btn">Settings</button>
    </div>
    <input type="file" id="file-input" accept=".json" style="display: none;">
  </div>
</div>
