<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$PROJECT_NAME</title>
  <link rel="preload" href="fonts/gomarice_goma_block.ttf" as="font" type="font/ttf" crossorigin>

  <!-- <link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/squareantiqua" type="text/css"/> -->
  <link rel="stylesheet" href="base-style.css">
  <link rel="stylesheet" href="src/performances/hyper/hyper.css">
  <link rel="stylesheet" href="src/performances/hyper/hyper-block.css">

</head>
<body>

  <div id="game-banner">
    <div class="text">
      <a href="/editors/" class="back-link">The Writer's Project</a>
      <span class="subtitle">$PROJECT_NAME</span>
    </div>

    <div id="controls" class="controls">
      <!-- Controls populated by controls.js -->
    </div>


  </div>

  <script src="./lib/compromise.js"></script>
  <script src="/editors/directions/Document.js"></script>
  <script src="/editors/directions/GameplaySave.js"></script>
  
  <!-- Import as ES module -->
  <script type="module">
    import { Game } from './game.js';
    import { Controls } from './controls.js';
    
    let currentGame = null;
    let currentSave = null;
    let currentDocumentId = null;
    let controls = null;
    
    function loadOrCreateSave() {
      if (GameplaySave.hasLocalStorage()) {
        return GameplaySave.fromLocalStorage();
      }
      // Create new save if none exists
      const save = new GameplaySave();
      const now = new Date().toISOString();
      save.setMetadata('dateCreated', now);
      save.setMetadata('dateModified', now);
      return save;
    }
    
    function createNewDocument(save) {
      const documentId = `doc_${Date.now()}`;
      const document = new Document(documentId, {
        createdAt: new Date().toISOString(),
        content: '',
        sourceEditor: 'hyper-skip-3',
        title: 'Untitled'
      });
      save.addDocument(document);
      save.setMetadata('dateModified', new Date().toISOString());
      return documentId;
    }
    
    async function createAndInitializeGame(save, documentId) {
      const game = new Game({ save, documentId });
      await game.initialize();
      return game;
    }
    
    function handleNewDocument() {
      const newDocumentId = createNewDocument(currentSave);
      currentSave.setMetadata('currentDocumentId', newDocumentId);
      currentSave.saveToLocalStorage();

      console.log("new document", newDocumentId);
      
      // Refresh the page to load the new document
      window.location.reload();
    }
    
    // Wait for DOM to be fully loaded before initializing
    document.addEventListener('DOMContentLoaded', async () => {
      console.log("DOMContentLoaded");
      currentSave = loadOrCreateSave();
      
      // Get or create a document
      currentDocumentId = currentSave.getMetadata('currentDocumentId');
      console.log("documentId", currentDocumentId);
      if (!currentDocumentId || !currentSave.hasDocument(currentDocumentId)) {
        currentDocumentId = createNewDocument(currentSave);
        currentSave.setMetadata('currentDocumentId', currentDocumentId);
        currentSave.saveToLocalStorage();
      }
      
      currentGame = await createAndInitializeGame(currentSave, currentDocumentId);
      
      // Initialize controls
      controls = new Controls({
        game: currentGame,
        save: currentSave,
        documentId: currentDocumentId,
        onNewDocument: handleNewDocument
      });
      
      await controls.initialize();
      
      // Setup autosave on input
      const editor = document.getElementById('editor');
      if (editor) {
        editor.addEventListener('input', () => {
          autoSave();
        });
      }
    });
    
    function autoSave() {
      if (!currentSave) return;
      
      const autosaveId = 'autosave_hyper-skip-3';
      let autosaveDoc = currentSave.getDocument(autosaveId);
      
      if (!autosaveDoc) {
        autosaveDoc = new Document(autosaveId, {
          title: 'Autosave',
          sourceEditor: 'hyper-skip-3',
          createdAt: new Date().toISOString(),
          isAutosave: true
        });
        currentSave.addDocument(autosaveDoc);
      }
      
      const editor = document.getElementById('editor');
      if (editor) {
        autosaveDoc.setField('content', editor.innerText);
        autosaveDoc.setField('lastModified', new Date().toISOString());
        currentSave.setMetadata('dateModified', new Date().toISOString());
        currentSave.saveToLocalStorage();
      }
    }
  </script>
  
  <div id="editor-container">
    <!-- <div id="editor" contenteditable="true"></div> -->
     <!-- I am doing this to disallow fancy pasting, but eventually I could upgrade to a different (temporary div? hack to allow rich text but not the existing paste format) -->
    <div id="editor" contenteditable="plaintext-only"></div>
    <div id="overlay"></div>
  </div>

</body>
</html>
