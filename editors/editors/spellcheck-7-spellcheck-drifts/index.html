<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spellchecker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-banner">
    <div class="text">
      <a href="/editors/" class="back-link">The Writer's Project</a>
      <span class="subtitle">$PROJECT_NAME</span>
    </div>

    <div id="controls" class="controls">
      <!-- Controls populated by controls.js -->
    </div>
  </div>

  <div id="mistake-list">
    
  </div>


<div id="prompt-container" class="meta-game prompt-container">
    <div id="prompt-display" class="prompt meta-game">
    </div>

    <div id="submit" class="meta-game"></div>
</div>


<div id="editor-container" class="editor-container photo-region">
  <div id="editor" class="editor" spellcheck="false" contenteditable="true"></div>
  <div id="overlay" class="overlay"></div>
</div>

  <script src="textIterator.js"></script>
  <script src="events.js"></script>
  <script src="SpellcheckPerformance.js" type="module"></script>

  <script type="module"> 
    import { Game } from './game.js';
    import { MetaGame } from '/editors/drifts/MetaGame.js';

    const PROJECT_ID = '$PROJECT_ID';
    const PROJECT_NAME = '$PROJECT_NAME';

    if (PROJECT_ID.startsWith('$')) {
        throw new Error('PROJECT_ID is not set');
    }

    // Wait for DOM to be fully loaded before initializing
    document.addEventListener('DOMContentLoaded', async () => {
        // Create game first
        const game = new Game();
        
        // MetaGame loads save
        const metaGame = new MetaGame(PROJECT_ID, PROJECT_NAME);
        // initializes the game
        await metaGame.initialize(game);
    });
  </script>
  
</body>
</html>
